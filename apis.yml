name: Ottonova
description: >-
  Ottonova is a Munich-based digital private health insurance provider (private
  Krankenversicherung) founded in 2015, positioned as "the insurance for the
  mobile age." It sells private full health insurance and supplementary dental
  and hospital coverage to consumers in Germany, delivering onboarding, claims,
  a concierge medical service and digital health records through its mobile app
  rather than through a public developer API. Ottonova is backed by venture
  investors including Earlybird and HV Capital and operates in the insurtech
  sector. This API Evangelist profile was created as a portfolio-lead stub and
  has been through one enrichment pass: probing confirmed a consumer web
  presence with a published RFC 9116 security.txt but no public API surface
  (no developer portal, OpenAPI, OAuth/OpenID metadata, or API catalog).
